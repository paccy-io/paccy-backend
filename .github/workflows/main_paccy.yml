# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - paccy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_f10a75f2565046078ca7e78b2af15abe }}
        password: ${{ secrets.AzureAppService_ContainerPassword_92872b5b9a8e4f068055380b0190eacd }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_f10a75f2565046078ca7e78b2af15abe }}/paccy-backend:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'paccy'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_8b8be75420764bb7be6a9a4e042e4666 }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_f10a75f2565046078ca7e78b2af15abe }}/paccy-backend:${{ github.sha }}'